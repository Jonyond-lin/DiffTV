# ---------------------------------------------------------------------------
# DiffTV stage 1b: VQ-VAE trained from scratch to RECONSTRUCT THERMAL (infrared) faces.
# Its ENCODER becomes the frozen conditional thermal encoder (TH_Encoder) in stage 2.
# Paper Fig.2: "we proceed to train another VQ-VAE model, this time focusing on the
# reconstruction of thermal images. The encoder from this second VQ-VAE model is then
# utilized as the conditional thermal encoder for subsequent translation tasks."
#
# Corrections vs the original configs/vqvae/vq.yaml:
#   * ddconfig.resolution 256 -> 128 and attn_resolutions [32] -> [16].
#     The real input is 128x128, and ch_mult has 4 entries => 3 downsamples => f=8,
#     so the latent is 16x16. Declaring resolution=256/attn@32 produced the SAME
#     architecture but described a model that was never trained, and it no longer
#     matched the stage-2 first_stage_config. Now both stages state the same thing.
#   * validation set was test/TH (thermal!) for a model reconstructing VIS -> test/VIS.
#   * compute_variance True -> False: main.py assigns it to model.variance, which
#     nothing ever reads, while loading the whole split into RAM in every process.
#   * gpus must be a STRING: main.py does lightning_config.trainer.gpus.strip(",").
#   * base_learning_rate rescaled so the EFFECTIVE lr is unchanged at 9.0e-05:
#     original 2 (accum) * 1 (gpu) * 10 (bs) * 4.5e-06 = 9.0e-05
#     here     1 (accum) * 4 (gpu) * 10 (bs) * 2.25e-06 = 9.0e-05
# ---------------------------------------------------------------------------
model:
  base_learning_rate: 2.25e-06
  target: ldm.models.autoencoder.VQModel
  params:
    embed_dim: 4
    n_embed: 16384
    image_key: image
    monitor: val/rec_loss
    ddconfig:
      double_z: false
      z_channels: 4
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 2, 4]      # 4 levels => 3 downsamples => f=8 => 128/8 = 16
      num_res_blocks: 2
      attn_resolutions: [16]     # attention at the deepest level (was [32] for a 256 input)
      dropout: 0.0
    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_num_layers: 2
        disc_start: 1
        disc_weight: 0.6
        codebook_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 10
    num_workers: 8
    wrap: true
    train:
      target: ldm.data.reconstruct.Reconstruction
      params:
        data_dir: data/thermal2visible_speakingfaces/train/TH
        in_size: 128
        compute_variance: false
    validation:
      target: ldm.data.reconstruct.Reconstruction
      params:
        data_dir: data/thermal2visible_speakingfaces/test/TH
        in_size: 128
        compute_variance: false

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: true
  trainer:
    benchmark: true
    accumulate_grad_batches: 1
    gpus: "0,1,2,3"
    max_epochs: 120
    check_val_every_n_epoch: 5
